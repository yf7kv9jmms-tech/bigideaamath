<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Game Loader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
        }
        select, button {
            padding: 10px 14px;
            font-size: 16px;
            margin: 5px;
        }
        #viewer {
            margin-top: 20px;
            width: 100%;
            height: 70vh;
            display: none;
        }
        #viewerFrame {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h2>Select a file to open</h2>

    <select id="fileSelect">
        <option value="">-- choose a file --</option>
    </select>
    <button id="openButton">Open</button>

    <div id="viewer">
        <iframe id="viewerFrame" title="viewer"></iframe>
    </div>

    <script>
        // ============================================
        // MANIFEST: list your repo's HTML files here.
        // Paths are relative to this page in the repo.
        // ============================================
        const FILES = [
            "Mantle.html",
            "game1.html",
            "game2.html",
            "folder/game3.html"
        ];

        const select = document.getElementById('fileSelect');

        // Populate dropdown
        FILES.forEach(path => {
            const name = path.split('/').pop(); // show just filename
            const opt = document.createElement('option');
            opt.value = path;
            opt.textContent = name;
            select.appendChild(opt);
        });

        document.getElementById('openButton').addEventListener('click', async () => {
            const path = select.value;
            if (!path) { alert('Please choose a file first.'); return; }

            try {
                // Fetch the file from the repo, make a blob URL out of it
                const response = await fetch(path);
                if (!response.ok) throw new Error('Could not load ' + path);

                const blob = await response.blob();
                const blobURL = URL.createObjectURL(blob);

                // Try opening in a new tab; fall back to embedded iframe
                const win = window.open(blobURL, '_blank');
                if (!win) {
                    const viewer = document.getElementById('viewer');
                    viewer.style.display = 'block';
                    document.getElementById('viewerFrame').src = blobURL;
                    viewer.scrollIntoView({ behavior: 'smooth' });
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
