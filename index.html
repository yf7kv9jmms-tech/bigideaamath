<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Main website favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <title>Big Ideas Math - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
        }

        select, button {
            padding: 10px 14px;
            font-size: 16px;
            margin: 5px;
        }

        #viewer {
            margin-top: 20px;
            width: 100%;
            height: 70vh;
            display: none;
        }

        #viewerFrame {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h2>Select a file to open</h2>

    <select id="fileSelect">
        <option value="">-- choose a file --</option>
    </select>

    <button id="openButton">Open</button>

    <div id="viewer">
        <iframe
            id="viewerFrame"
            title="viewer"
            src="about:blank">
        </iframe>
    </div>

    <script>
        // ============================================
        // MANIFEST
        // ============================================
        const FILES = [
            "Mantle.html",
            "chess.html",
            "game2.html",
            "folder/game3.html"
        ];

        const select = document.getElementById("fileSelect");
        const viewer = document.getElementById("viewer");
        const viewerFrame = document.getElementById("viewerFrame");

        // Keep track of created Blob URLs so they can be cleaned up.
        const blobURLs = [];

        // ============================================
        // POPULATE DROPDOWN
        // ============================================
        FILES.forEach(path => {
            const name = path.split("/").pop();

            const opt = document.createElement("option");
            opt.value = path;
            opt.textContent = name;

            select.appendChild(opt);
        });

        // ============================================
        // GET TITLE FROM HTML
        // ============================================
        function getTitle(html, fallback) {
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");

                const title = doc.querySelector("title");

                if (title && title.textContent.trim()) {
                    return title.textContent.trim();
                }
            } catch (error) {
                console.warn("Could not read title:", error);
            }

            return fallback;
        }

        // ============================================
        // PREPARE HTML FOR ABOUT:BLANK IFRAME
        // ============================================
        function prepareIframeHTML(html, originalPath) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            // --------------------------------------------
            // Ensure <head> exists
            // --------------------------------------------
            if (!doc.head) {
                const head = doc.createElement("head");
                doc.documentElement.insertBefore(
                    head,
                    doc.body || null
                );
            }

            // --------------------------------------------
            // Preserve the original title
            // --------------------------------------------
            let title = doc.querySelector("title");

            if (!title) {
                title = doc.createElement("title");
                doc.head.appendChild(title);
            }

            // --------------------------------------------
            // Add the same favicon
            // --------------------------------------------
            // Remove existing favicon declarations so the
            // opened page consistently uses our favicon.
            doc.querySelectorAll(
                'link[rel~="icon"], link[rel="shortcut icon"]'
            ).forEach(link => link.remove());

            const favicon = doc.createElement("link");
            favicon.rel = "icon";
            favicon.type = "image/x-icon";

            // favicon.ico is located beside this launcher.
            favicon.href = new URL(
                "favicon.ico",
                window.location.href
            ).href;

            doc.head.appendChild(favicon);

            // --------------------------------------------
            // Make relative resources work
            // --------------------------------------------
            // Since the iframe itself is about:blank,
            // relative paths would otherwise resolve against
            // about:blank.
            //
            // The original HTML file's directory becomes
            // the base for its CSS, JS, images, etc.
            const directory = originalPath.substring(
                0,
                originalPath.lastIndexOf("/") + 1
            );

            const base = doc.createElement("base");

            base.href = new URL(
                directory || "./",
                window.location.href
            ).href;

            doc.head.insertBefore(
                base,
                doc.head.firstChild
            );

            return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
        }

        // ============================================
        // OPEN FILE
        // ============================================
        document
            .getElementById("openButton")
            .addEventListener("click", async () => {

                const path = select.value;

                if (!path) {
                    alert("Please choose a file first.");
                    return;
                }

                try {
                    // ----------------------------------------
                    // Fetch the original HTML file
                    // ----------------------------------------
                    const response = await fetch(path, {
                        cache: "no-cache"
                    });

                    if (!response.ok) {
                        throw new Error(
                            "Could not load " + path
                        );
                    }

                    const html = await response.text();

                    // ----------------------------------------
                    // Determine its original title
                    // ----------------------------------------
                    const fallbackTitle =
                        path.split("/").pop();

                    const pageTitle = getTitle(
                        html,
                        fallbackTitle
                    );

                    // ----------------------------------------
                    // Prepare the iframe version
                    // ----------------------------------------
                    const iframeHTML =
                        prepareIframeHTML(
                            html,
                            path
                        );

                    // ----------------------------------------
                    // Create a Blob for the actual website
                    // ----------------------------------------
                    const blob = new Blob(
                        [html],
                        {
                            type: "text/html"
                        }
                    );

                    const blobURL =
                        URL.createObjectURL(blob);

                    blobURLs.push(blobURL);

                    // ----------------------------------------
                    // Keep the actual opened website as Blob
                    // ----------------------------------------
                    const win = window.open(
                        blobURL,
                        "_blank"
                    );

                    // ----------------------------------------
                    // Also open/render the same website
                    // inside an about:blank iframe.
                    // ----------------------------------------
                    viewer.style.display = "block";

                    // Explicitly keep iframe at about:blank.
                    viewerFrame.src = "about:blank";

                    viewerFrame.onload = () => {
                        try {
                            const iframeDoc =
                                viewerFrame.contentDocument ||
                                viewerFrame.contentWindow.document;

                            iframeDoc.open();
                            iframeDoc.write(iframeHTML);
                            iframeDoc.close();

                            // Keep the iframe document title
                            // synchronized with the source page.
                            viewerFrame.title = pageTitle;

                        } catch (error) {
                            console.error(
                                "Could not write iframe:",
                                error
                            );
                        }
                    };

                    // Force the iframe's about:blank load
                    // handler to fire.
                    viewerFrame.src = "about:blank";

                    // ----------------------------------------
                    // Scroll the viewer into view
                    // ----------------------------------------
                    viewer.scrollIntoView({
                        behavior: "smooth"
                    });

                } catch (err) {
                    alert(
                        "Error: " + err.message
                    );
                }
            });

        // ============================================
        // CLEAN UP BLOB URLS WHEN PAGE CLOSES
        // ============================================
        window.addEventListener("beforeunload", () => {
            blobURLs.forEach(url => {
                URL.revokeObjectURL(url);
            });
        });
    </script>

</body>
</html>
