<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="grades/favicon.ico" type="image/x-icon">
    <title>Campus Student</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Trebuchet MS", "Avenir Next", sans-serif;
            background: #111815;
            color: #f1f4ec;
        }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: repeating-linear-gradient(135deg, transparent 0 22px, #ffffff06 22px 23px);
        }
        main { display: grid; justify-items: center; gap: 18px; padding: 24px; text-align: center; }
        h1 { margin: 0; font-size: 26px; }
        button {
            min-height: 48px;
            padding: 0 20px;
            border: 1px solid #d7f36b;
            border-radius: 4px;
            background: #d7f36b;
            color: #182013;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }
        input {
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #536158;
            border-radius: 4px;
            background: #202a25;
            color: #f1f4ec;
            font: inherit;
        }
        button:focus-visible, input:focus-visible { outline: 2px solid #f1f4ec; outline-offset: 3px; }
        form { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        [hidden] { display: none !important; }
        #status { min-height: 1.3em; color: #ff9677; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>Campus Student</h1>
        <form id="accessForm">
            <label for="passwordInput" class="visually-hidden">Password</label>
            <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Unlock</button>
        </form>
        <button id="launchButton" type="button" hidden disabled>Open grade library</button>
        <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
        const accessForm = document.getElementById("accessForm");
        const passwordInput = document.getElementById("passwordInput");
        const launchButton = document.getElementById("launchButton");
        const status = document.getElementById("status");

        accessForm.addEventListener("submit", event => {
            event.preventDefault();
            if (passwordInput.value !== "1246+372") {
                status.textContent = "Incorrect password.";
                passwordInput.select();
                return;
            }

            accessForm.hidden = true;
            launchButton.hidden = false;
            launchButton.disabled = false;
            status.textContent = "Access granted.";
            launchButton.focus();
        });

        launchButton.addEventListener("click", () => {
            const popup = window.open("about:blank", "_blank");
            if (!popup) {
                status.textContent = "Allow popups to open the grade library in a new tab.";
                return;
            }

            const popupDocument = popup.document;
            popupDocument.title = document.title;

            const favicon = popupDocument.createElement("link");
            favicon.rel = "icon";
            favicon.type = "image/x-icon";
            favicon.href = new URL("grades/favicon.ico", window.location.href).href;
            popupDocument.head.appendChild(favicon);

            const style = popupDocument.createElement("style");
            style.textContent = "html,body{width:100%;height:100%;margin:0;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}";
            popupDocument.head.appendChild(style);

            const player = popupDocument.createElement("iframe");
            player.src = new URL("grades/index.html", window.location.href).href;
            player.title = document.title;
            player.allow = "fullscreen; autoplay; gamepad";
            player.allowFullscreen = true;
            popupDocument.body.appendChild(player);
            popup.opener = null;
        });
    </script>
</body>
</html>
