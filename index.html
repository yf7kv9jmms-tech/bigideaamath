</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Big Ideas Math - Login</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }
        select, button {
            padding: 10px 14px;
            font-size: 16px;
            margin: 5px;
        }
        button:disabled, select:disabled { opacity: .55; cursor: not-allowed; }
        #status { min-height: 1.4em; margin: 12px 0; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <h2>Select a file to open</h2>

    <select id="fileSelect">
        <option value="">-- choose a file --</option>
    </select>

    <button id="openButton">Open</button>
    <div id="status" role="status" aria-live="polite"></div>

    <script>
        const FILES = [
            "Mantle.html",
            "chess.html",
            "cookie-clicker.htm",
            "krillion.html",
            "melon-playground.html",
            "moto-x3m-pool-party.html",
            "plants-vs-zombies.html",
            "retro-bowl.html",
            "riddle-school.html",
            "riddle-school-2.html",
            "riddle-school-3.html",
            "riddle-school-4.html",
            "riddle-school-5.html",
            "superhot.html",
            "the-impossible-quiz.html",
            "the-impossible-quiz-2.html",
            "tomb-of-the-mask.htm"
        ];

        const select = document.getElementById("fileSelect");
        const openButton = document.getElementById("openButton");
        const status = document.getElementById("status");
        function setStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle("error", isError);
        }

        function loadAvailableFiles() {
            select.replaceChildren(
                new Option("-- choose a file --", "")
            );

            for (const path of FILES) {
                select.appendChild(
                    new Option(path.split("/").pop(), path)
                );
            }

            select.disabled = false;
            openButton.disabled = false;
        }

        openButton.addEventListener("click", () => {
            const path = select.value;
            if (!path) {
                setStatus("Please choose a file first.", true);
                return;
            }

            const popup = window.open("about:blank", "_blank");
            if (popup) {
                popup.opener = null;
                popup.location.href = path;
                setStatus("Opened " + path + " in a new tab.");
            } else {
                window.location.href = path;
            }
        });

        loadAvailableFiles();
    </script>
</body>
</html>
